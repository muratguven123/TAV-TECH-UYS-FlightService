server:
  port: 8083

spring:
  application:
    name: FlightService
  config:
    import: optional:configserver:http://config-server:8888

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/uys_flights?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:uys}
    password: ${SPRING_DATASOURCE_PASSWORD:uys_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        max.in.flight.requests.per.connection: 5
        # Tip başlığı yazmayı kapat — consumer kendi eşlemesini yönetir
        spring.json.use.type.headers: false
    consumer:
      group-id: reference-cache-sync
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tav.FlightService.events"
        spring.json.value.default.type: com.tav.FlightService.events.ReferenceChangedEvent

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  gateway:
    secret: ${GATEWAY_SECRET:tav-gateway-internal-secret-change-in-prod}
    url: ${GATEWAY_URL:http://localhost:8080}
  reference:
    base-url: ${REFERENCE_MANAGER_URL:http://localhost:8082}
    validator: ${REFERENCE_VALIDATOR:caching}
  internal-user:
    username: ${INTERNAL_USER_FLIGHT:flight-service-internal}
  websocket:
    # Prod'da gerçek domain'lerle daraltılmalıdır — asla "*" kullanılmaz
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
  refill-seconds: ${RATE_LIMIT_REFILL_SECONDS:60}
