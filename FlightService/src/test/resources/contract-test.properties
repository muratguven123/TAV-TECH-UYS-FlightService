# ─────────────────────────────────────────────────────────────────────────────
# reference.events — FlightService consumer contract test
# (ReferenceEventConsumerContractTest)
# ─────────────────────────────────────────────────────────────────────────────
# The integration-transport stub message is bridged onto the embedded-Kafka
# "reference.events" topic, then consumed by the real ReferenceCacheSyncListener
# (groupId=reference-cache-sync). The consumer must read from the start of the
# partition so a message bridged before partition assignment is still delivered.
spring.kafka.consumer.auto-offset-reset=earliest
